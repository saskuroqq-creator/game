name: Build uploaded Anima Survivors Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - .github/workflows/build-anima-uploaded.yml
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download uploaded source archive
        run: |
          set -e
          curl -L --fail --retry 3 --retry-delay 2 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-7938-8210-ab00-643850b15600/raw?se=2026-09-26T04%3A13%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=af4eba4c-9de0-5a80-990e-886a9f4a82bc&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T19%3A53%3A20Z&ske=2026-09-26T19%3A53%3A20Z&sks=b&skv=2026-02-06&sig=N9Rnxodus1hHpJJlikawhOEp9mEYMBaEBenM998uGUc%3D' -o source.zip
          unzip -q source.zip
          ROOT=$(find . -maxdepth 1 -type d -name 'Anima_Survivors_Reborn_v0.20_RELEASE_CANDIDATE_90' | head -n 1)
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Configure Android-safe rendering
        working-directory: ${{ env.ROOT }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project.godot')
          s=p.read_text()
          s=s.replace('config/features=PackedStringArray("4.7", "Forward Plus")','config/features=PackedStringArray("4.7", "Mobile")')
          s=s.replace('renderer/rendering_method="forward_plus"','renderer/rendering_method="mobile"')
          if 'renderer/rendering_method.mobile.driver=' not in s:
              s=s.replace('[rendering]\n','[rendering]\nrenderer/rendering_method.mobile.driver="vulkan"\n')
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Anima Survivors,C=UZ" -keyalg RSA -keysize 2048 -validity 10000

      - name: Export APK
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ${{ env.ROOT }}
          presets_to_export: Android
          export_debug: true
          cache: true

      - name: Collect APK
        run: |
          set -e
          mkdir -p release
          APK=$(find "$ROOT" -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" release/AnimaSurvivorsReborn-v0.20.0-A57-debug.apk
          sha256sum release/AnimaSurvivorsReborn-v0.20.0-A57-debug.apk > release/AnimaSurvivorsReborn-v0.20.0-A57-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimaSurvivorsReborn-Android-A57-v0.20.0
          path: release/*
          if-no-files-found: error
          retention-days: 30