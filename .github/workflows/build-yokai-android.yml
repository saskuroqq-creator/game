name: YOKAI V1.9 Air Physics Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, "yokai/**" ]
    paths:
      - "YOKAI_6000_3_24F1_CLEAN/**"
      - ".github/workflows/build-yokai-android.yml"

permissions:
  contents: read

concurrency:
  group: yokai-v19-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Android ARM64 APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: YOKAI_6000_3_24F1_CLEAN
          unityVersion: 6000.3.24f1
          targetPlatform: Android
          buildMethod: Yokai.EditorTools.YokaiProjectBootstrap.BuildAndroidCi
          versioning: None

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="YOKAI_6000_3_24F1_CLEAN/Builds/Android/YOKAI_V19_AIR_PHYSICS_RC.apk"
          test -s "$apk"
          unzip -t "$apk"
          unzip -l "$apk" | grep 'lib/arm64-v8a/libil2cpp.so'
          sha256sum "$apk" | tee YOKAI_V19_AIR_PHYSICS_RC_SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > YOKAI_V19_AIR_PHYSICS_RC_COMMIT.txt
          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YOKAI-V1.9-Air-Physics-RC-Android-${{ github.sha }}
          path: |
            YOKAI_6000_3_24F1_CLEAN/Builds/Android/YOKAI_V19_AIR_PHYSICS_RC.apk
            YOKAI_V19_AIR_PHYSICS_RC_SHA256.txt
            YOKAI_V19_AIR_PHYSICS_RC_COMMIT.txt
          if-no-files-found: error
          retention-days: 30
