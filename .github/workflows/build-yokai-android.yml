name: Build YOKAI Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.1
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=YOKAI,C=UZ" -keyalg RSA -keysize 2048 -validity 10000
      - name: Export Android APK
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: .
          presets_to_export: Android
          export_debug: true
          cache: true
      - name: Collect APK
        run: |
          set -e
          mkdir -p release
          find "$HOME/.local/share/godot/builds" -type f -name '*.apk' -print
          APK="$(find "$HOME/.local/share/godot/builds" -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" release/YOKAI-Shadows-of-Izanami-Android.apk
          sha256sum release/YOKAI-Shadows-of-Izanami-Android.apk > release/YOKAI-Shadows-of-Izanami-Android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: YOKAI-Shadows-of-Izanami-Android
          path: release/*
          if-no-files-found: error
          retention-days: 30
